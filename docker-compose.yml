services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: saga-kafka
    ports:
      - "9092:9092" # 호스트(로컬에서 실행하는 Spring 앱)용
    environment:
      # KRaft 모드: ZooKeeper 없이 브로커가 컨트롤러 역할까지 겸한다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 리스너 3개
      #  - PLAINTEXT      : 도커 네트워크 내부용 (kafka-ui 등 다른 컨테이너가 접속)
      #  - PLAINTEXT_HOST : 호스트용 (localhost:9092)
      #  - CONTROLLER     : 컨트롤러 전용 (클라이언트는 사용하지 않음)
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 브로커가 1대뿐이므로 내부 토픽의 복제 계수를 1로 맞춘다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: saga-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8989:8080" # 서비스들이 8080대를 쓸 수 있도록 UI는 8989로 노출
    environment:
      KAFKA_CLUSTERS_0_NAME: saga-flow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  kafka-data:
