server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: saga
    password: saga
  jpa:
    hibernate:
      # 아직 마이그레이션 도구가 없으므로 엔티티 기준으로 스키마를 맞춘다. (학습용)
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
