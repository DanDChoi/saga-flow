# test 프로파일: Docker 없이 돌 수 있도록 인메모리 DB를 쓰고, 브로커 없이 컨텍스트만 띄우도록 리스너 자동 시작을 끈다.
spring:
  datasource:
    url: jdbc:h2:mem:order_db;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    listener:
      auto-startup: false

# 릴레이는 테스트에서 직접 호출한다. 백그라운드로 돌면 outbox 행을 먼저 발행해 버린다.
outbox:
  relay:
    enabled: false
